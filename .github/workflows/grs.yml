name: Update README cards

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: readme-cards
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5                               #v4

      - name: Generate stats card
        uses: readme-tools/github-readme-stats-action@d82657a0e215a28ec48bfc9b3987999a279f93be        #v1
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true
          path: profile/stats.svg
          token: ${{ secrets.GH_PAT }}

      - name: Generate trophy
        continue-on-error: true                                                                      # trophy/Deno failure won't block the card commit
        uses: Erik-Donath/github-profile-trophy@eb0893b31de06841663555d10aa43eb7cf27952f             # feature/generate-svg, pinned <date>
        with:
          username: ${{ github.repository_owner }}
          file: profile/trophy.svg
          theme: flat
          max-cols: 4            # 9 trophies → 6 + 3 over two rows (matches al-folio's desktop default)
          margin-width: 15
          margin-height: 15
          no-background: false
          token: ${{ secrets.GH_PAT }}

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          if ! git diff --staged --quiet; then
            git commit -m "Update profile cards"
            git push
          fi
