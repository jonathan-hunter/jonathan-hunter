name: Update README cards

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: readme-cards
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5                               #v4

      # Stats cards are themed to match the site's teal palette rather than
      # github-readme-stats' default blue. Two variants are generated so the
      # site can swap them via its .only-light / .only-dark mechanism.
      # Background is transparent and the border is hidden — the site's
      # .github-summary-stats panel supplies the card frame per theme.
      # Light: teal accent (#0e6c74) + near-black text (#15181b).
      - name: Generate stats card (light)
        uses: readme-tools/github-readme-stats-action@d82657a0e215a28ec48bfc9b3987999a279f93be        #v1
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&title_color=0e6c74&icon_color=0e6c74&ring_color=0e6c74&text_color=15181b&bg_color=00000000&hide_border=true
          path: profile/stats-light.svg
          token: ${{ secrets.GH_PAT }}

      # Dark: teal accent (#5fd2d2) + light text (#e9eae6).
      - name: Generate stats card (dark)
        uses: readme-tools/github-readme-stats-action@d82657a0e215a28ec48bfc9b3987999a279f93be        #v1
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&title_color=5fd2d2&icon_color=5fd2d2&ring_color=5fd2d2&text_color=e9eae6&bg_color=00000000&hide_border=true
          path: profile/stats-dark.svg
          token: ${{ secrets.GH_PAT }}

      - name: Generate trophy (light)
        continue-on-error: true                                                                      # trophy/Deno failure won't block the card commit
        uses: Erik-Donath/github-profile-trophy@eb0893b31de06841663555d10aa43eb7cf27952f             # feature/generate-svg, pinned <date>
        with:
          username: ${{ github.repository_owner }}
          file: profile/trophy-light.svg
          theme: flat
          max-cols: 4            # 9 trophies → 6 + 3 over two rows (matches al-folio's desktop default)
          margin-width: 15
          margin-height: 15
          no-background: false
          token: ${{ secrets.GH_PAT }}

      - name: Generate trophy (dark)
        continue-on-error: true                                                                      # trophy/Deno failure won't block the card commit
        uses: Erik-Donath/github-profile-trophy@eb0893b31de06841663555d10aa43eb7cf27952f             # feature/generate-svg, pinned <date>
        with:
          username: ${{ github.repository_owner }}
          file: profile/trophy-dark.svg
          theme: gitdimmed       # muted dark theme that sits on the site's dark card
          max-cols: 4
          margin-width: 15
          margin-height: 15
          no-background: false
          token: ${{ secrets.GH_PAT }}

      # github-profile-trophy keeps its native rank palette; only re-frame the
      # cards to the site surface (border + dark cell background) after
      # generation so the grid sits on the same card as the stats/pin cards.
      - name: Re-frame trophies to site card surface
        continue-on-error: true
        run: |
          bash profile/recolor-trophy.sh light profile/trophy-light.svg
          bash profile/recolor-trophy.sh dark profile/trophy-dark.svg

      # Repository pin cards, themed to match the site palette (replacing the
      # unthemeable opengraph.githubassets.com banners). Two variants each so
      # the site swaps them via .only-light / .only-dark. Transparent bg +
      # hidden border — the site's .repo-pin-cards frame supplies the card.
      - name: Generate pin — Metabolomics-Pipeline (light)
        continue-on-error: true
        uses: readme-tools/github-readme-stats-action@d82657a0e215a28ec48bfc9b3987999a279f93be        #v1
        with:
          card: pin
          options: username=jonathan-hunter&repo=Metabolomics-Pipeline&show_owner=true&description_lines_count=2&title_color=0e6c74&icon_color=0e6c74&text_color=15181b&bg_color=00000000&hide_border=true
          path: profile/pin-metabolomics-pipeline-light.svg
          token: ${{ secrets.GH_PAT }}

      - name: Generate pin — Metabolomics-Pipeline (dark)
        continue-on-error: true
        uses: readme-tools/github-readme-stats-action@d82657a0e215a28ec48bfc9b3987999a279f93be        #v1
        with:
          card: pin
          options: username=jonathan-hunter&repo=Metabolomics-Pipeline&show_owner=true&description_lines_count=2&title_color=5fd2d2&icon_color=5fd2d2&text_color=e9eae6&bg_color=00000000&hide_border=true
          path: profile/pin-metabolomics-pipeline-dark.svg
          token: ${{ secrets.GH_PAT }}

      - name: Generate pin — psi-ms-CV (light)
        continue-on-error: true
        uses: readme-tools/github-readme-stats-action@d82657a0e215a28ec48bfc9b3987999a279f93be        #v1
        with:
          card: pin
          options: username=HUPO-PSI&repo=psi-ms-CV&show_owner=true&description_lines_count=2&title_color=0e6c74&icon_color=0e6c74&text_color=15181b&bg_color=00000000&hide_border=true
          path: profile/pin-psi-ms-cv-light.svg
          token: ${{ secrets.GH_PAT }}

      - name: Generate pin — psi-ms-CV (dark)
        continue-on-error: true
        uses: readme-tools/github-readme-stats-action@d82657a0e215a28ec48bfc9b3987999a279f93be        #v1
        with:
          card: pin
          options: username=HUPO-PSI&repo=psi-ms-CV&show_owner=true&description_lines_count=2&title_color=5fd2d2&icon_color=5fd2d2&text_color=e9eae6&bg_color=00000000&hide_border=true
          path: profile/pin-psi-ms-cv-dark.svg
          token: ${{ secrets.GH_PAT }}

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          if ! git diff --staged --quiet; then
            git commit -m "Update profile cards"
            git push
          fi
